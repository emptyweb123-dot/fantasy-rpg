<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Демонстрация скилла — Огненный шквал</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff2db}body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 40%,#31506f 0,#18273e 48%,#09111d 100%)}
.demo{width:min(470px,100%);height:min(850px,calc(100dvh - 36px));min-height:620px;position:relative;overflow:hidden;border:1px solid #7392ae;border-radius:20px;background:linear-gradient(180deg,#142a43aa,#111c2dbb),repeating-linear-gradient(135deg,transparent 0 33px,#d2e2fa0c 34px 36px),radial-gradient(ellipse at 50% 55%,#496a87,#1c2b43 70%);box-shadow:0 22px 70px #000b}
.title{position:absolute;top:17px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#e5cf9e;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.turn{padding:8px 11px;border:1px solid #ffffff30;border-radius:8px;background:#0b1424aa;color:#dce8f8;letter-spacing:0}.turn b{display:block;margin-top:3px;text-align:center;font-size:15px;color:white}
.enemy-wrap{position:absolute;top:14%;left:50%;width:180px;transform:translateX(-50%);text-align:center}.hp{width:100%;height:15px;margin:0 auto 9px;position:relative;overflow:hidden;border:2px solid #d9c474;border-radius:5px;background:#3e1520;box-shadow:0 0 10px #38ff7b55}.hp i{display:block;width:100%;height:100%;background:linear-gradient(#6aff57,#0eaa31 70%,#047221)}.hp span{position:absolute;inset:0;display:grid;place-items:center;font-weight:bold;font-size:11px;text-shadow:0 1px 2px #000}
.monster{width:136px;height:136px;margin:auto;position:relative;display:grid;place-items:center;border:7px solid #a77632;border-radius:13px;background:radial-gradient(circle at 50% 30%,#1185bb,#073465 67%,#111c39);box-shadow:0 0 0 3px #271a18,0 0 25px #148dff8c,inset 0 0 20px #09c9f855;font-size:76px;filter:saturate(1.2)}.monster:before{content:"";position:absolute;inset:5px;border:1px solid #f4cc6c88;border-radius:5px}.monster.hit{animation:shake .42s ease-in-out,ignite 1.1s ease-out}.rune{position:absolute;right:-24px;top:7px;color:#fff3a6;font-size:25px;text-shadow:0 0 13px #fff,0 0 24px #53dfff}.rune.shake{animation:cast .35s ease-in-out 3}
.ally{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:135px;text-align:center}.ally-card{height:146px;position:relative;display:grid;place-items:center;overflow:hidden;border:5px solid #dfbf60;border-radius:12px;background:radial-gradient(circle at 50% 35%,#6a476c,#18253c 72%);box-shadow:0 0 17px #f9c65388;font-size:75px}.ally-card:before{content:"";position:absolute;inset:5px;border:1px solid #f7dd9d77;border-radius:5px}.ally-card.cast{animation:cast .48s ease-in-out 2}.ally-name{margin:7px 0;color:#eed69e;font-weight:bold;font-size:13px}.ally-hp{height:12px;margin:0;border-color:#72d584}.ally-hp span{font-size:9px}
.fire-orb{position:absolute;z-index:4;left:66%;top:24%;width:26px;height:26px;opacity:0;transform:translate(-50%,-50%) scale(.1);pointer-events:none}.fire-orb.appear{animation:orbAppear .55s cubic-bezier(.18,.8,.3,1.25) forwards}.fire-orb.erupt{animation:orbErupt .38s ease-in forwards}.fire-core{position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fffde0 0 12%,#fff77c 20%,#ff9a1c 48%,#e9210c 78%,#750d24);box-shadow:0 0 12px 5px #ffeb69,0 0 26px 13px #ff6819,0 0 44px 20px #fa220d}.fire-halo{position:absolute;inset:-9px;border:2px solid #ffe87a;border-radius:50%;box-shadow:0 0 15px 5px #ff6518;animation:haloPulse .3s ease-in-out infinite alternate}
.fire-wave{position:absolute;z-index:3;left:50%;top:24%;width:180px;height:180px;opacity:0;transform:translate(-50%,-50%) scale(.12);pointer-events:none;border:13px solid #ff7b13;border-radius:50%;background:radial-gradient(circle,#fff7a533 0 20%,#ff4b0633 42%,transparent 69%);box-shadow:0 0 14px 8px #ffb51c,0 0 42px 18px #ff4d0a, inset 0 0 22px #fff1a6;filter:blur(1px)}.fire-wave.go{animation:waveExpand 1.15s cubic-bezier(.12,.45,.22,1) forwards}.fire-wave.second.go{animation-delay:.16s}.flash{position:absolute;z-index:5;left:50%;top:24%;width:40px;height:40px;opacity:0;transform:translate(-50%,-50%);pointer-events:none}.flash.go{animation:burst .78s ease-out forwards}.flash:before,.flash:after{content:"";position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,#fff7ba 0 8%,#ffe238aa 13%,#ff5900aa 30%,transparent 68%);filter:blur(3px)}.flash:after{inset:-52px;background:radial-gradient(circle,transparent 42%,#ffdd5488 44% 48%,transparent 51%);filter:none}.damage{position:absolute;z-index:6;left:50%;top:28%;opacity:0;transform:translate(-50%,0);font-weight:900;font-size:29px;color:#fff183;text-shadow:0 2px 2px #6f1400,0 0 9px #ff2a00;pointer-events:none}.damage.go{animation:damage 1.1s ease-out forwards}
.controls{position:absolute;left:16px;right:16px;bottom:16px;display:grid;gap:9px}.skill{width:100%;padding:13px;border:1px solid #d99a49;border-radius:9px;background:linear-gradient(#633720,#321c19);color:#ffe9bb;font-weight:bold;letter-spacing:.08em}.skill:active{transform:scale(.98)}.hint{text-align:center;color:#b9c7d8;font-size:11px;line-height:1.45}
@keyframes cast{0%,100%{transform:scale(1)}35%{transform:scale(1.13) rotate(-2deg);filter:brightness(1.8)}65%{transform:scale(1.07) rotate(2deg);filter:brightness(1.35)}}@keyframes orbAppear{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes orbErupt{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.8)}}@keyframes haloPulse{to{transform:scale(1.25);opacity:.55}}@keyframes waveExpand{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}12%{opacity:1}72%{opacity:.72}100%{opacity:0;transform:translate(-50%,-50%) scale(3.35)}}@keyframes shake{0%,100%{transform:translateX(0) scale(1)}20%{transform:translateX(-7px) scale(1.07)}45%{transform:translateX(7px) scale(1.11)}70%{transform:translateX(-4px) scale(1.04)}}@keyframes ignite{0%{filter:brightness(1) saturate(1)}20%{filter:brightness(2.6) saturate(1.6) sepia(.8)}60%{filter:brightness(1.8) sepia(.6)}100%{filter:brightness(1) saturate(1.2)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}24%{opacity:1;transform:translate(-50%,-50%) scale(2.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.4)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,-9px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-62px) scale(1)}}
@media(max-height:700px){.enemy-wrap{top:12%}.ally{bottom:8%}.ally-card{height:120px}.demo{min-height:0}}
</style>
</head>
<body><main class="demo" aria-label="Макет анимации огненного навыка">
<div class="title"><span>Огненный шквал · демонстрация</span><span class="turn">Ход<b>1 / 10</b></span></div>
<section class="enemy-wrap"><div class="hp"><i></i><span id="enemyHp">100% · 1 500 / 1 500</span></div><div class="monster" id="monster">👹<span class="rune" id="rune">✦</span></div></section>
<div class="fire-orb" id="fireOrb"><i class="fire-core"></i><i class="fire-halo"></i></div><div class="fire-wave" id="wave"></div><div class="fire-wave second" id="wave2"></div><div class="flash" id="flash"></div><div class="damage" id="damage">−448</div>
<section class="ally"><div class="ally-card" id="ally">🧙</div><div class="ally-name">Душегуб</div><div class="hp ally-hp"><i></i><span>1 000 / 1 000</span></div></section>
<div class="controls"><button class="skill" id="play">▶ Показать удар</button><div class="hint">Огненный шар возникает рядом с монстром, вспыхивает и выпускает расширяющуюся огненную волну по арене.</div></div>
</main><script>
const play=document.getElementById('play'),fireOrb=document.getElementById('fireOrb'),wave=document.getElementById('wave'),wave2=document.getElementById('wave2'),flash=document.getElementById('flash'),damage=document.getElementById('damage'),monster=document.getElementById('monster'),ally=document.getElementById('ally'),rune=document.getElementById('rune');
function cast(){[fireOrb,wave,wave2,flash,damage].forEach(node=>{node.classList.remove('appear','erupt','go');void node.offsetWidth});monster.classList.remove('hit');ally.classList.remove('cast');rune.classList.remove('shake');void monster.offsetWidth;ally.classList.add('cast');rune.classList.add('shake');setTimeout(()=>fireOrb.classList.add('appear'),260);setTimeout(()=>{fireOrb.classList.remove('appear');fireOrb.classList.add('erupt');wave.classList.add('go');wave2.classList.add('go');monster.classList.add('hit');flash.classList.add('go');damage.classList.add('go')},1060);setTimeout(()=>{monster.classList.remove('hit');ally.classList.remove('cast');rune.classList.remove('shake')},2300)}
play.addEventListener('click',cast);setTimeout(cast,650);
</script></body></html>
