<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100f">
<title>Королевства Пепла</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#53351e 0%,transparent 48%),linear-gradient(145deg,#191612,#080b10);color:#f2e6d0;font-family:Georgia,serif}
main{position:relative;overflow:hidden;width:min(900px,100%);min-height:580px;padding:48px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #a17b4855;background:linear-gradient(180deg,#080a0f44,#08090cf2),radial-gradient(ellipse at 50% 80%,#49301d,#17191c 65%);box-shadow:0 25px 90px #000a}
.kicker{font:12px Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#c6a36b;margin-bottom:20px}.sigil{font-size:42px;color:#c49a58;text-shadow:0 0 25px #c18a3c66}h1{font-size:clamp(40px,8vw,76px);line-height:.98;letter-spacing:.04em;text-transform:uppercase;margin:12px 0;text-shadow:0 4px 25px #000}.sub{font:13px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#c8b99f;margin:14px 0 38px}
nav{display:grid;gap:12px;width:min(310px,100%);z-index:1}button{padding:15px 18px;border:1px solid #a17b48;background:linear-gradient(#4b3825,#241c15);color:#f5e7cc;font:bold 13px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}button:hover{border-color:#e0b873;background:linear-gradient(#71502e,#382719)}button.alt{background:#111318dd;border-color:#6b604f;color:#cfc3ad}.notice{min-height:20px;margin-top:18px;color:#d5b77e;font:12px Arial,sans-serif}.foot{position:absolute;bottom:18px;color:#8e877c;font:10px Arial,sans-serif;letter-spacing:.12em}
@media(max-width:520px){main{min-height:calc(100vh - 48px)}.sub{font-size:11px;line-height:1.6}}
.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:#050609dd}.modal.open{display:grid}.dialog{width:min(420px,100%);padding:28px;border:1px solid #a17b48;background:linear-gradient(145deg,#252019,#101216);box-shadow:0 20px 70px #000c;text-align:left}.dialog h2{margin:0 0 22px;text-align:center;color:#e5c58e;font-size:25px}.dialog label{display:block;margin:16px 0 8px;color:#c8b99f;font:12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.dialog input{width:100%;padding:13px;background:#0d0f12;border:1px solid #6b604f;color:#f5e7cc;font-size:16px}.genders{display:flex;gap:10px}.genders button{flex:1}.genders button.selected{border-color:#e0b873;background:#71502e}.dialog .actions{display:flex;gap:10px;margin-top:24px}.dialog .actions button{flex:1}.error{min-height:18px;color:#e5a18d;font:12px Arial,sans-serif;margin-top:8px}
#gameScreen{display:none;position:fixed;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 42%,#3c3023 0%,#171717 54%,#090a0c 100%);color:#eee5d2;overflow:hidden;font-family:Georgia,serif}
#gameScreen.active{display:flex;flex-direction:column;align-items:center}
.game-top{position:fixed;z-index:1;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(180deg,#090a0cf2,#171717e8);border-bottom:1px solid #9b784a88;box-shadow:0 8px 24px #0008}
.hero-info{min-width:0;display:flex;align-items:center;gap:12px}
.hero-badge{width:54px;height:54px;flex:none;display:grid;place-items:center;border:2px solid #b18b50;border-radius:6px;background:radial-gradient(circle at 35% 25%,#74502d,#211b16 70%);font-size:27px;text-shadow:0 2px 4px #000}
.hero-name{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff2d6;font:bold 17px Arial,sans-serif;text-shadow:0 2px 4px #000}
.hero-level{margin-top:5px;color:#d5b77e;font:bold 12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.coin-count{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid #987344;border-radius:8px;background:linear-gradient(90deg,#20180f,#111);font:bold 18px Arial,sans-serif;box-shadow:inset 0 1px #ffffff18}
.coin-icon{font-size:23px;line-height:1}
.game-button{display:none}
.game-bottom{position:fixed;left:0;right:0;bottom:0;width:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:6px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#251a10,#100d0a);border-top:2px solid #9b7040;box-shadow:0 -8px 24px #0009}
.game-bottom button{min-width:0;height:70px;padding:5px 2px;background:linear-gradient(180deg,#332619,#1b140e);border:1px solid #74552f;border-radius:7px;color:#f4e4c7;font:bold 10px Arial,sans-serif;letter-spacing:0;text-transform:none;text-shadow:0 2px 4px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px #ffffff14,0 2px 5px #0008}
.game-bottom button:hover{background:linear-gradient(180deg,#45331f,#261b10);border-color:#b18b50}
.game-bottom .map-button{height:84px;transform:translateY(-14px);border-color:#c19a5b;background:linear-gradient(180deg,#68482a,#302014);box-shadow:inset 0 1px #ffffff24,0 4px 10px #000a}
.game-bottom .map-button .nav-icon{font-size:36px}
.nav-icon{font-size:27px;line-height:1.1;filter:drop-shadow(0 2px 2px #000)}
@media(max-width:520px){.game-top{padding:11px 12px}.hero-badge{width:46px;height:46px}.hero-name{font-size:15px}.coin-count{font-size:16px;padding:8px 10px}.game-bottom{gap:5px;padding-left:4px;padding-right:4px}.game-bottom button{font-size:clamp(8px,2.1vw,10px);height:66px}.game-bottom .map-button{height:80px;transform:translateY(-12px)}.game-bottom .map-button .nav-icon{font-size:34px}.nav-icon{font-size:24px}}
#heroesScreen{display:none;position:fixed;inset:0;z-index:4;flex-direction:column;background:radial-gradient(ellipse at 50% 20%,#38291d,#141313 58%,#090a0c);color:#f2e6d0;font-family:Georgia,serif}
#heroesScreen.active{display:flex}
.heroes-header{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:#0c0d0fee;border-bottom:1px solid #9b784a88;box-shadow:0 6px 20px #0008}
.heroes-back{width:44px;height:44px;padding:0;border:1px solid #74552f;border-radius:7px;background:#20180f;color:#f4e4c7;font:32px/1 Arial,sans-serif;letter-spacing:0}
.heroes-header h2{margin:0;text-align:center;color:#e5c58e;font:bold 19px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.heroes-list{width:min(600px,100%);flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 auto;padding:14px 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.hero-card{min-height:102px;display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:14px;padding:10px;border:2px solid #77532f;border-radius:10px;background:linear-gradient(115deg,#63402c,#33241b 72%,#241a14);box-shadow:inset 0 1px #ffffff16,0 4px 12px #0008}
.hero-avatar{width:76px;height:76px;display:grid;place-items:center;overflow:hidden;border:4px solid #40c6a0;border-radius:5px;background:radial-gradient(circle at 50% 30%,#777,#292929 74%);box-shadow:0 0 0 2px #161616,0 2px 7px #0009}
.hero-avatar svg{width:100%;height:100%;display:block}
.hero-card:nth-child(2n) .hero-avatar{border-color:#b64cdf;background:radial-gradient(circle at 50% 30%,#777,#24242a 74%)}
.hero-card:nth-child(3n) .hero-avatar{border-color:#36b6e8;background:radial-gradient(circle at 50% 30%,#777,#25282c 74%)}
.hero-card-name{color:#f1d3a0;font:bold 18px Georgia,serif;text-shadow:0 2px 3px #000}
.hero-card-level{margin-top:7px;color:#e6c78f;font:bold 14px Arial,sans-serif}
@media(max-width:520px){.heroes-header{grid-template-columns:42px 1fr 42px;padding-left:10px;padding-right:10px}.heroes-back{width:40px;height:40px}.heroes-list{padding:12px 9px calc(18px + env(safe-area-inset-bottom));gap:8px}.hero-card{min-height:94px;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:8px}.hero-avatar{width:68px;height:68px}.hero-card-name{font-size:16px}}
#inventoryScreen{display:none;position:fixed;inset:0;z-index:4;flex-direction:column;background:radial-gradient(ellipse at 50% 18%,#243b49,#111a22 55%,#091015);color:#f2e6d0;font-family:Georgia,serif}
#inventoryScreen.active{display:flex}
.inventory-header{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:#0c1118f2;border-bottom:1px solid #54768b;box-shadow:0 6px 20px #0008}
.inventory-header h2{margin:0;text-align:center;color:#e5c58e;font:bold 19px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.inventory-back{width:44px;height:44px;padding:0;border:1px solid #58778d;border-radius:7px;background:linear-gradient(#314d61,#172a38);color:#f4e4c7;font:30px/1 Arial,sans-serif}
.inventory-categories{width:100%;flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:12px 8px;border-bottom:1px solid #456174;background:#101b24dd}
.inventory-category{min-width:0;height:48px;padding:3px;border:1px solid #49687d;border-radius:6px;background:linear-gradient(#263f50,#142734);color:#f5e7cc;font:24px/1 Arial,sans-serif;box-shadow:inset 0 1px #ffffff14}
.inventory-category.active{border-color:#f0c56b;background:linear-gradient(#477896,#214a62);box-shadow:0 0 10px #62b9e866,inset 0 1px #ffffff2e}
.inventory-items{width:min(700px,100%);flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 auto;padding:12px 8px calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-content:start;gap:6px}
.inventory-empty{grid-column:1/-1;align-self:center;justify-self:center;margin:0;color:#b5c2c8;font:14px Arial,sans-serif;text-align:center}
.inventory-item{aspect-ratio:1;position:relative;display:grid;place-items:center;min-width:0;border:2px solid #77838b;border-radius:4px;background:linear-gradient(145deg,#18242d,#070d12);box-shadow:inset 0 1px #ffffff16,0 2px 5px #0009}
.inventory-item-icon{font-size:clamp(26px,9vw,48px);line-height:1;filter:drop-shadow(0 2px 3px #000)}
.inventory-item-count{position:absolute;right:4px;bottom:2px;color:#fff;font:bold 12px Arial,sans-serif;text-shadow:0 2px 3px #000}
@media(max-width:520px){.inventory-header{grid-template-columns:42px 1fr 42px;padding-left:10px;padding-right:10px}.inventory-back{width:40px;height:40px}.inventory-categories{gap:4px;padding:10px 6px}.inventory-category{height:44px;font-size:21px}.inventory-items{gap:5px;padding:10px 6px calc(16px + env(safe-area-inset-bottom))}.inventory-item-count{font-size:11px}}
#mapScreen{display:none;position:fixed;inset:0;z-index:4;flex-direction:column;background:#15202a;color:#f2e6d0;font-family:Georgia,serif}
#mapScreen.active{display:flex}
.map-header{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:#0c1118f2;border-bottom:1px solid #54768b;box-shadow:0 6px 20px #0008;z-index:2}
.map-header h2{margin:0;text-align:center;color:#e5c58e;font:bold 19px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.map-back{width:44px;height:44px;padding:0;border:1px solid #58778d;border-radius:7px;background:linear-gradient(#314d61,#172a38);color:#f4e4c7;font:30px/1 Arial,sans-serif}
.map-scroll{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#7b6845 #17252b}
.map-world{position:relative;width:100%;height:1600px;overflow:hidden;background:linear-gradient(180deg,#827d42 0%,#b4a14f 18%,#695538 34%,#b19a4b 50%,#496440 66%,#927e3d 82%,#28534d 100%)}
.map-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-stages{position:absolute;inset:0;z-index:1}
.map-stage{position:absolute;transform:translate(-50%,-50%);width:58px;height:44px;display:grid;place-items:center;border:2px solid #c9a55d;border-radius:50%;background:linear-gradient(180deg,#47356b,#251a43);box-shadow:0 3px 7px #100b1bcc,inset 0 1px #ffffff40;color:#fff0c9;font:bold 16px Arial,sans-serif;text-shadow:0 2px 3px #000}
.map-stage.current{border-color:#fff0a0;box-shadow:0 0 0 4px #f2cd5b55,0 0 20px #ffd45c,inset 0 1px #ffffff70}
.map-stage.current::after{content:"";position:absolute;top:-10px;width:11px;height:11px;border:2px solid #fff0a0;border-radius:50%;background:#f8df74;box-shadow:0 0 10px #ffd45c}
@media(max-width:520px){.map-header{grid-template-columns:42px 1fr 42px;padding-left:10px;padding-right:10px}.map-back{width:40px;height:40px}.map-world{height:1550px}.map-stage{width:54px;height:42px;font-size:15px}}
</style>
</head>
<body>
<main>
<div class="kicker">Летопись павших королевств</div><div class="sigil">✦</div>
<h1>Королевства<br>Пепла</h1>
<p class="sub">Мир ждёт тех, кто осмелится войти</p>
<nav><button id="new">Начать приключение</button><button class="alt" id="continue">Продолжить</button><button class="alt" id="settings">Настройки</button></nav>
<div class="notice" id="notice" aria-live="polite"></div>
<div class="foot">ОДИНОЧНОЕ ПРИКЛЮЧЕНИЕ · ПЕРВАЯ ВЕРСИЯ</div>
</main>
<section id="gameScreen" aria-label="Игровой экран">
 <header class="game-top">
  <div class="hero-info"><div class="hero-badge" aria-hidden="true">⚔️</div><div><div class="hero-name" id="heroName">Герой</div><div class="hero-level" id="heroLevel">Уровень 1</div></div></div>
  <div class="coin-count" aria-label="Монеты"><span class="coin-icon" aria-hidden="true">🪙</span><span id="coinCount">0</span></div>
 </header>
 <nav class="game-bottom" aria-label="Игровое меню">
  <button id="openHeroes" type="button"><span class="nav-icon" aria-hidden="true">🛡️</span>Герои</button>
  <button id="openInventory" type="button"><span class="nav-icon" aria-hidden="true">🎒</span>Инвентарь</button>
  <button class="map-button" id="openMap" type="button" aria-label="Карта"><span class="nav-icon" aria-hidden="true">🗺️</span></button>
  <button type="button"><span class="nav-icon" aria-hidden="true">⚔️</span>Кампания</button>
  <button type="button"><span class="nav-icon" aria-hidden="true">📜</span>Приключения</button>
 </nav>
</section>
<section id="heroesScreen" aria-label="Герои">
 <header class="heroes-header">
  <button class="heroes-back" id="closeHeroes" type="button" aria-label="Назад">‹</button>
  <h2>Герои</h2>
  <span aria-hidden="true"></span>
 </header>
 <div class="heroes-list" id="heroesList" aria-label="Список героев"></div>
</section>
<section id="inventoryScreen" aria-label="Инвентарь">
 <header class="inventory-header">
  <button class="inventory-back" id="closeInventory" type="button" aria-label="Назад">‹</button>
  <h2>Предметы</h2>
  <span aria-hidden="true"></span>
 </header>
 <nav class="inventory-categories" aria-label="Категории предметов">
  <button class="inventory-category" type="button" data-category="weapon" aria-label="Оружие" title="Оружие">⚔️</button>
  <button class="inventory-category" type="button" data-category="armor" aria-label="Броня" title="Броня">👘</button>
  <button class="inventory-category" type="button" data-category="jewelry" aria-label="Бижутерия" title="Бижутерия">💍</button>
  <button class="inventory-category" type="button" data-category="items" aria-label="Предметы" title="Предметы">📦</button>
  <button class="inventory-category" type="button" data-category="consumables" aria-label="Расходники" title="Расходники">🧪</button>
  <button class="inventory-category" type="button" data-category="amulets" aria-label="Амулеты" title="Амулеты">🔮</button>
  <button class="inventory-category" type="button" data-category="coins" aria-label="Монеты" title="Монеты">🪙</button>
 </nav>
 <div class="inventory-items" id="inventoryItems" aria-label="Список предметов"><p class="inventory-empty" id="inventoryEmpty">Инвентарь пока пуст</p></div>
</section>
<section id="mapScreen" aria-label="Карта уровней">
 <header class="map-header">
  <button class="map-back" id="closeMap" type="button" aria-label="Назад">‹</button>
  <h2>Карта</h2>
  <span aria-hidden="true"></span>
 </header>
 <div class="map-scroll" id="mapScroll" tabindex="0" aria-label="Прокручиваемая карта уровней">
  <div class="map-world">
   <svg class="map-art" viewBox="0 0 400 1550" preserveAspectRatio="none" aria-hidden="true">
    <defs>
     <linearGradient id="land" x2="0" y2="1"><stop stop-color="#4f7970"/><stop offset=".16" stop-color="#c1ac54"/><stop offset=".34" stop-color="#886443"/><stop offset=".52" stop-color="#c8a951"/><stop offset=".7" stop-color="#53745a"/><stop offset=".86" stop-color="#b8a250"/><stop offset="1" stop-color="#285a58"/></linearGradient>
     <linearGradient id="trail" x2="0" y2="1"><stop stop-color="#d9b96c"/><stop offset="1" stop-color="#967143"/></linearGradient>
     <linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#ed8bff"/><stop offset=".5" stop-color="#7848d8"/><stop offset="1" stop-color="#33267d"/></linearGradient>
     <pattern id="groundMarks" width="44" height="48" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="2" fill="#fff4ad" opacity=".18"/><circle cx="31" cy="34" r="3" fill="#183b37" opacity=".2"/><path d="M18 6l4 5m-7 26 5-3" stroke="#f8dc81" stroke-width="2" opacity=".15"/></pattern>
    </defs>
    <rect width="400" height="1550" fill="url(#land)"/><rect width="400" height="1550" fill="url(#groundMarks)"/>
    <path d="M0 0H86Q65 72 0 98ZM400 75Q342 128 400 195ZM0 330Q75 375 0 455ZM400 610Q332 684 400 742ZM0 880Q82 939 0 1018ZM400 1190Q315 1248 400 1312ZM0 1420Q68 1483 0 1550" fill="#275c63" opacity=".85"/>
    <path d="M80 105 C30 150 310 180 280 250 S100 330 144 395 S340 470 312 540 S30 610 88 685 S330 760 252 830 S60 900 140 975 S350 1040 312 1120 S40 1180 100 1265 S350 1330 244 1410" fill="none" stroke="#60452e" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 105 C30 150 310 180 280 250 S100 330 144 395 S340 470 312 540 S30 610 88 685 S330 760 252 830 S60 900 140 975 S350 1040 312 1120 S40 1180 100 1265 S350 1330 244 1410" fill="none" stroke="url(#trail)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 105 C30 150 310 180 280 250 S100 330 144 395 S340 470 312 540 S30 610 88 685 S330 760 252 830 S60 900 140 975 S350 1040 312 1120 S40 1180 100 1265 S350 1330 244 1410" fill="none" stroke="#f0d889" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 16" opacity=".55"/>
    <g fill="#293b38" stroke="#536957" stroke-width="5" opacity=".9"><ellipse cx="47" cy="210" rx="26" ry="17"/><ellipse cx="356" cy="320" rx="34" ry="20"/><ellipse cx="45" cy="520" rx="30" ry="20"/><ellipse cx="350" cy="790" rx="32" ry="22"/><ellipse cx="46" cy="1080" rx="31" ry="20"/><ellipse cx="356" cy="1360" rx="28" ry="18"/></g>
    <g fill="url(#crystal)" stroke="#c28bff" stroke-width="3"><path d="M26 282l15-50 16 48-12 11z"/><path d="M40 292l21-64 13 60-16 12z"/><path d="M337 455l13-49 18 43-12 12z"/><path d="M315 470l22-65 10 68-17 8z"/><path d="M42 760l16-54 15 51-14 13z"/><path d="M324 930l19-60 15 58-15 11z"/><path d="M26 1190l17-53 15 54-13 10z"/><path d="M334 1480l16-50 17 52-15 11z"/></g>
    <g fill="#52645a" stroke="#303d38" stroke-width="5"><path d="M27 600l21-27 21 28-8 21H34z"/><path d="M328 715l24-31 21 33-10 18h-28z"/><path d="M30 1005l22-28 23 31-11 17H38z"/><path d="M322 1180l25-32 21 35-10 18h-29z"/></g>
   </svg>
   <div class="map-stages" id="mapStages" aria-label="Уровни 1–10"></div>
  </div>
 </div>
</section>\n<div class="modal" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createTitle">
 <section class="dialog">
  <h2 id="createTitle">Создание персонажа</h2>
  <label for="nickname">Ваш ник</label>
  <input id="nickname" type="text" maxlength="20" placeholder="Введите ник" autocomplete="nickname">
  <label>Пол</label>
  <div class="genders"><button type="button" class="alt selected" data-gender="Мужской">Мужской</button><button type="button" class="alt" data-gender="Женский">Женский</button></div>
  <div class="error" id="formError" aria-live="polite"></div>
  <div class="actions"><button type="button" class="alt" id="cancelCreate">Назад</button><button type="button" id="confirmCreate">Далее</button></div>
 </section>
</div>
<script>
const n=document.getElementById('notice');
const modal=document.getElementById('createModal');
const heroesScreen=document.getElementById('heroesScreen');
const heroesList=document.getElementById('heroesList');
const inventoryScreen=document.getElementById('inventoryScreen');
const inventoryItemsElement=document.getElementById('inventoryItems');
const inventoryEmpty=document.getElementById('inventoryEmpty');
const mapScreen=document.getElementById('mapScreen');
const mapScroll=document.getElementById('mapScroll');
const mapStages=document.getElementById('mapStages');
let selectedInventoryCategory='all';
const inventoryItems=[];
let selectedGender='Мужской';
function loadSave(){try{const save=JSON.parse(localStorage.getItem('ashKingdomsSave')||'null');return save&&typeof save.nickname==='string'&&save.nickname.trim()?save:null}catch{return null}}
function renderHeroes(level){heroesList.replaceChildren();for(let i=0;i<6;i++){const card=document.createElement('article');card.className='hero-card';const avatar=document.createElement('div');avatar.className='hero-avatar';avatar.setAttribute('aria-hidden','true');avatar.innerHTML='<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M5 64c2-14 12-21 27-21s25 7 27 21" fill="#44474a" stroke="#a5a19a" stroke-width="3"/><path d="M20 26c0-11 5-17 13-17s13 6 13 17v8c0 9-6 16-13 16s-13-7-13-16z" fill="#b9b4aa"/><path d="M18 27c0-15 5-22 15-22 9 0 15 7 15 22l-5-5-4-8-7 5-8-2z" fill="#383a3c"/><path d="M25 30h4m7 0h4m-11 9c2 2 6 2 8 0" fill="none" stroke="#4b4a47" stroke-width="2" stroke-linecap="round"/><path d="M14 63l6-13 12 7 12-7 6 13" fill="#272b30" stroke="#92908a" stroke-width="2"/></svg>';const info=document.createElement('div');const name=document.createElement('div');name.className='hero-card-name';name.textContent='Герой';const levelLabel=document.createElement('div');levelLabel.className='hero-card-level';levelLabel.textContent=`Уровень ${level}`;info.append(name,levelLabel);card.append(avatar,info);heroesList.append(card)}}
document.getElementById('openHeroes').onclick=()=>{const save=loadSave();renderHeroes(save?.level||1);heroesScreen.classList.add('active')};
document.getElementById('closeHeroes').onclick=()=>heroesScreen.classList.remove('active');
function renderInventory(){inventoryItemsElement.querySelectorAll('.inventory-item').forEach(item=>item.remove());const visibleItems=inventoryItems.filter(item=>selectedInventoryCategory==='all'||item.category===selectedInventoryCategory);inventoryEmpty.hidden=visibleItems.length>0;visibleItems.forEach(item=>{const tile=document.createElement('div');tile.className='inventory-item';tile.setAttribute('aria-label',`${item.name}, количество ${item.count}`);const icon=document.createElement('span');icon.className='inventory-item-icon';icon.setAttribute('aria-hidden','true');icon.textContent=item.icon;const count=document.createElement('span');count.className='inventory-item-count';count.textContent=item.count;tile.append(icon,count);inventoryItemsElement.append(tile)})}
document.getElementById('openInventory').onclick=()=>{selectedInventoryCategory='all';document.querySelectorAll('.inventory-category').forEach(button=>{button.classList.remove('active');button.setAttribute('aria-pressed','false')});renderInventory();inventoryScreen.classList.add('active')};
document.getElementById('closeInventory').onclick=()=>inventoryScreen.classList.remove('active');
document.querySelectorAll('.inventory-category').forEach(button=>button.onclick=()=>{selectedInventoryCategory=button.dataset.category;document.querySelectorAll('.inventory-category').forEach(categoryButton=>{const active=categoryButton===button;categoryButton.classList.toggle('active',active);categoryButton.setAttribute('aria-pressed',String(active))});renderInventory()});
document.getElementById('openMap').onclick=()=>{const save=loadSave();renderMap(save?.chapter||1);mapScreen.classList.add('active')};
document.getElementById('closeMap').onclick=()=>mapScreen.classList.remove('active');
function renderMap(currentLevel){mapStages.replaceChildren();const columns=[20,70,36,78,22,63,35,78,25,61];const yStart=105;const yStep=145;const activeLevel=Math.min(10,Math.max(1,Number(currentLevel)||1));for(let level=1;level<=10;level++){const node=document.createElement('div');node.className=`map-stage${level===activeLevel?' current':''}`;node.textContent=level;node.setAttribute('role','img');node.setAttribute('aria-label',`Уровень ${level}${level===activeLevel?', текущий':''}`);node.style.left=`${columns[level-1]}%`;node.style.top=`${yStart+(level-1)*yStep}px`;mapStages.append(node)}mapScroll.scrollTop=0;requestAnimationFrame(()=>{if(activeLevel>1){const currentNode=mapStages.querySelector('.map-stage.current');mapScroll.scrollTop=Math.max(0,currentNode.offsetTop-mapScroll.clientHeight*.42)}})}
document.getElementById('new').onclick=()=>{modal.classList.add('open');document.getElementById('nickname').focus()};
document.getElementById('cancelCreate').onclick=()=>{modal.classList.remove('open')};
document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{selectedGender=b.dataset.gender;document.querySelectorAll('[data-gender]').forEach(x=>x.classList.toggle('selected',x===b))});
function showGame(save){document.getElementById('heroName').textContent=save.nickname;document.getElementById('heroLevel').textContent=`Уровень ${save.level||1}`;document.getElementById('coinCount').textContent=save.coins||0;document.querySelector('main').style.display='none';document.getElementById('gameScreen').classList.add('active')}
document.getElementById('confirmCreate').onclick=()=>{const nickname=document.getElementById('nickname').value.trim();if(!nickname){document.getElementById('formError').textContent='Введите ник.';return}const save={nickname,gender:selectedGender,createdAt:Date.now(),chapter:1,level:1,coins:0};localStorage.setItem('ashKingdomsSave',JSON.stringify(save));modal.classList.remove('open');showGame(save)};
document.getElementById('continue').onclick=()=>{const save=loadSave();if(save)showGame(save);else n.textContent='Сохранений пока нет. Начните новое приключение.'};
document.getElementById('settings').onclick=()=>{n.textContent='Настройки появятся в следующем обновлении.'};
const savedGame=loadSave();if(savedGame)showGame(savedGame);
</script>
</body>
</html>
